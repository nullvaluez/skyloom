<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lounge room render harness</title>
<!-- Served by scripts/render-lounge-room.cjs. 'three' and its examples resolve
     to the repo's own node_modules copy, so the room modules load unbundled,
     exactly as written (the server resolves extensionless relative specifiers
     to .js / .mjs the way webpack does). -->
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/examples/jsm/": "/node_modules/three/examples/jsm/",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="module" src="./harness.js"></script>
</body>
</html>
