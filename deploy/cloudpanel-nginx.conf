# Skyloom multiplayer — CloudPanel → Sites → (your site) → Vhost.
# Paste this block INSIDE the `server { ... }` block, just ABOVE the existing
# `location / {` line, and click Save. It hands the multiplayer WebSocket
# (/mp) to the relay that PM2 runs on 127.0.0.1:8787 (skyloom-relay).
location ^~ /mp {
  proxy_pass http://127.0.0.1:8787;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}
