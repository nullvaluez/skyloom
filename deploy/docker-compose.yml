# Skyloom on one VPS: the web app, the multiplayer relay and Caddy (TLS).
# All three share the HOST network, so Caddy reaches both on 127.0.0.1 and the
# relay's default MP_TRUST_PROXY=loopback reads each player's real IP from
# Caddy's X-Forwarded-For (on a bridge network every player would share the
# gateway's IP and hit the per-IP cap).
#
#   SKYLOOM_DOMAIN=skyloom.example.com docker compose -f deploy/docker-compose.yml up -d --build
#
# Nothing here stores player data; caddy_data holds only TLS certificates.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
      args:
        NEXT_PUBLIC_MP_URL: /mp
    network_mode: host
    restart: unless-stopped
  relay:
    build:
      context: ..
      dockerfile: deploy/relay.Dockerfile
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 5s
    environment:
      MP_HOST: 127.0.0.1
      MP_PORT: "8787"
      MP_ORIGINS: https://${SKYLOOM_DOMAIN:?set SKYLOOM_DOMAIN}
  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    environment:
      SKYLOOM_DOMAIN: ${SKYLOOM_DOMAIN:?set SKYLOOM_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data: {}
  caddy_config: {}
