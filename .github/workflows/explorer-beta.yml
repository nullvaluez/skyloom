name: Explorer beta
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: explorer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:beta
      - run: npm run build:beta
      - run: npm run smoke:beta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explorer-beta-evidence
          path: .graphics-review/beta
          include-hidden-files: true
